# /* ---- 💫 Hyprlock Config 💫 ---- */ #
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = rgb(0,0,0)
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $color8
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold 
    position = 0, -200
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 230, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $color13
    fade_on_empty = false
    placeholder_text = <i>🔒 Şifre Giriniz</i>
    position = 0, 100
    halign = center
    valign = bottom
}
