animations {
  enabled = yes

  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.5, 0, 0.99, 0.99
  bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
  
  animation = windows, 1, 4, wind, slide
  animation = windowsIn, 1, 4, winIn, slide
  animation = windowsOut, 1, 2, smoothOut, slide
  animation = windowsMove, 1, 4, wind, slide
  animation = border, 1, 1, liner
  # borderangle loop kaldirildi: tek renkli kenarlikta gorunur etkisi yok,
  # buna ragmen surekli yeniden cizim tetikleyebiliyor.
  animation = fade, 1, 2, smoothOut
  animation = workspaces, 1, 4, overshot
  
  # animations for -git or version >0.42.0
  animation = workspacesIn, 1, 4, winIn, slide
  animation = workspacesOut, 1, 4, winOut, slide
}